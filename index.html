<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Agenda Semanal Luan PL2042</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --black: #080808;
    --panel: #0f0f0f;
    --panel2: #141414;
    --white: #f4f1eb;
    --gold: #c9a84c;
    --gold-dim: rgba(201,168,76,0.15);
    --gray-mid: #333;
    --gray-light: #888;
    --border: rgba(255,255,255,0.09);
    --hour-h: 70px;

    --c-energia: #36a866;      --c-energia-bg: rgba(54,168,102,0.18);
    --c-manutencao: #3d86c6;   --c-manutencao-bg: rgba(61,134,198,0.18);
    --c-crescimento: #c9a84c;  --c-crescimento-bg: rgba(201,168,76,0.18);
    --c-leilao: #d0473b;       --c-leilao-bg: rgba(208,71,59,0.18);
    --c-networking: #a05bc4;   --c-networking-bg: rgba(160,91,196,0.18);
    --c-imprevisto: #6a6a6a;   --c-imprevisto-bg: rgba(130,130,130,0.15);
    --c-pessoal: #9b59b6;      --c-pessoal-bg: rgba(155,89,182,0.18);
  }

  html, body { height: 100%; }
  body {
    background-color: var(--black);
    color: var(--white);
    font-family: 'Sora', sans-serif;
    font-weight: 400;
    overflow: hidden;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 89px, rgba(255,255,255,0.013) 89px, rgba(255,255,255,0.013) 90px);
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--gold);
    background: var(--black); position: relative; z-index: 30; gap: 10px;
  }
  .topbar-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .brand { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.06em; color: var(--white); line-height: 1; white-space: nowrap; }
  .brand em { color: var(--gold); font-style: normal; }
  .topbar-actions { display: flex; gap: 7px; flex-shrink: 0; }
  .btn {
    font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold);
    background: transparent; border: 1px solid rgba(201,168,76,0.4);
    border-radius: 3px; padding: 8px 12px; cursor: pointer;
    transition: all 0.2s ease; white-space: nowrap;
  }
  .btn:hover { background: var(--gold-dim); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--gold); color: var(--black); border-color: var(--gold); }
  .btn.sm { padding: 6px 9px; font-size: 10px; }

  /* ── VIEW SWITCHER + NAV ── */
  .controlbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 9px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border); position: relative; z-index: 22; flex-wrap: wrap;
  }
  .nav-group { display: flex; align-items: center; gap: 8px; }
  .nav-arrow {
    width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--border);
    background: transparent; color: var(--white); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .nav-arrow:hover { border-color: var(--gold); color: var(--gold); }
  .nav-label {
    font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--white); min-width: 150px; text-align: center; font-weight: 500;
  }
  .nav-label small { display:block; font-size: 9px; color: var(--gray-light); letter-spacing: 0.18em; margin-top: 2px; }
  .seg {
    display: flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden;
  }
  .seg button {
    font-family: 'Sora', sans-serif; font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-light);
    background: transparent; border: none; padding: 8px 14px; cursor: pointer; transition: all 0.18s;
  }
  .seg button.active { background: var(--gold); color: var(--black); }
  .today-btn { font-size: 10px; padding: 7px 11px; }

  /* ── LEGEND ── */
  .legend {
    display: flex; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--border);
    overflow-x: auto; background: var(--panel); position: relative; z-index: 20; scrollbar-width: none;
  }
  .legend::-webkit-scrollbar { display: none; }
  .legend-item { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .legend-item span { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: #aaa; }

  /* ── MAIN SCROLL WRAPPER (holds calendar + dashboard + notes) ── */
  .app-scroll { height: calc(100vh - 132px); overflow-y: auto; overflow-x: hidden; position: relative; }
  .app-scroll::-webkit-scrollbar { width: 9px; }
  .app-scroll::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }

  /* ════════ WEEK / DAY GRID ════════ */
  .grid-wrap { position: relative; }
  .grid-scroller { overflow-x: auto; overflow-y: visible; position: relative; }
  .grid-scroller::-webkit-scrollbar { height: 9px; }
  .grid-scroller::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }

  /* Cabeçalho dos dias: sticky em relação ao app-scroll (rolagem vertical) */
  .day-header-scroller {
    position: sticky; top: 0; z-index: 25;
    overflow-x: hidden; overflow-y: visible;
    background: var(--black); border-bottom: 1px solid var(--gold);
  }
  .day-header-row {
    display: grid;
    background: var(--black);
  }
  .corner-cell { border-right: 1px solid var(--border); }
  .day-head { padding: 10px 6px; text-align: center; border-right: 1px solid var(--border); cursor: pointer; }
  .day-head:hover { background: rgba(255,255,255,0.02); }
  .day-head .dow { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.08em; color: var(--white); line-height: 1; }
  .day-head .date { font-size: 10px; letter-spacing: 0.1em; color: var(--gray-light); margin-top: 3px; }
  .day-head.special .dow { color: var(--gold); }
  .day-head.is-today { background: var(--gold-dim); }
  .day-head.is-today .dow { color: var(--gold); }
  .day-head .flag { display: block; font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c-leilao); margin-top: 3px; font-weight: 600; }

  .grid-body { display: grid; position: relative; }
  .time-col { position: relative; border-right: 1px solid var(--border); }
  .time-slot { height: var(--hour-h); position: relative; }
  .time-slot span { position: absolute; top: -8px; right: 6px; font-size: 11px; color: var(--gray-light); font-variant-numeric: tabular-nums; font-weight: 500; }
  .day-col { position: relative; border-right: 1px solid var(--border); }
  .day-col.special-bg { background: repeating-linear-gradient(-45deg, transparent, transparent 14px, rgba(208,71,59,0.045) 14px, rgba(208,71,59,0.045) 28px); }
  .day-col.is-today { background: rgba(201,168,76,0.04); }
  .hour-line { height: var(--hour-h); border-bottom: 1px solid var(--border); }

  /* ── EVENT ── */
  .event {
    position: absolute; border-radius: 5px; padding: 5px 8px 4px; overflow: hidden;
    cursor: grab; border-left: 3px solid var(--gold); background: var(--gold-dim);
    z-index: 5; transition: box-shadow 0.15s ease, transform 0.05s ease, opacity 0.2s;
    user-select: none; touch-action: none; display: flex; flex-direction: column;
  }
  .event:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.5); z-index: 8; }
  .event.dragging { opacity: 0.9; box-shadow: 0 10px 30px rgba(0,0,0,0.7); z-index: 50; cursor: grabbing; transform: scale(1.01); }
  .event.selected { box-shadow: 0 0 0 2px var(--gold), 0 4px 16px rgba(0,0,0,0.5); z-index: 9; }
  .event .ev-top { display: flex; align-items: flex-start; gap: 5px; }
  .event .ev-check {
    width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid rgba(255,255,255,0.4);
    flex-shrink: 0; margin-top: 1px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all 0.15s; background: rgba(0,0,0,0.2);
  }
  .event .ev-check:hover { border-color: var(--white); }
  .event .ev-check.done { background: var(--c-energia); border-color: var(--c-energia); }
  .event .ev-check.done::after { content: '✓'; font-size: 11px; color: #fff; font-weight: 700; line-height: 1; }
  .event .ev-body { min-width: 0; flex: 1; }
  .event .ev-time { font-size: 10px; font-variant-numeric: tabular-nums; opacity: 0.9; margin-bottom: 1px; font-weight: 600; }
  .event .ev-title { font-size: 12.5px; line-height: 1.22; font-weight: 500; color: var(--white); word-break: break-word; }
  .event .ev-proj { font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; margin-top: auto; padding-top: 3px; opacity: 0.72; font-weight: 400; }
  .event.done-ev { opacity: 0.5; }
  .event.done-ev .ev-title { text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.5); }
  .event.compact { padding: 4px 7px; }
  .event.compact .ev-proj { display: none; }
  .event.compact .ev-time { margin-bottom: 0; }
  .event.compact .ev-title { font-size: 11px; }

  .cat-energia    { border-left-color: var(--c-energia); background: var(--c-energia-bg); }
  .cat-manutencao { border-left-color: var(--c-manutencao); background: var(--c-manutencao-bg); }
  .cat-crescimento{ border-left-color: var(--c-crescimento); background: var(--c-crescimento-bg); }
  .cat-leilao     { border-left-color: var(--c-leilao); background: var(--c-leilao-bg); }
  .cat-networking { border-left-color: var(--c-networking); background: var(--c-networking-bg); }
  .cat-imprevisto { border-left-color: var(--c-imprevisto); background: var(--c-imprevisto-bg); border-left-style: dashed; }
  .cat-pessoal    { border-left-color: var(--c-pessoal); background: var(--c-pessoal-bg); }

  .resize-handle { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; cursor: ns-resize; touch-action: none; }
  .resize-handle::after { content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 26px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); }

  .day-banner {
    position: absolute; top: 3px; left: 3px; right: 3px; z-index: 6;
    background: rgba(208,71,59,0.18); border: 1px solid rgba(208,71,59,0.4);
    border-radius: 4px; padding: 5px 8px; font-size: 10px; line-height: 1.35;
    color: #e8a89f; letter-spacing: 0.02em; pointer-events: none;
  }
  .day-banner b { color: var(--c-leilao); font-weight: 600; }

  /* ════════ MONTH VIEW ════════ */
  .month-wrap { padding: 14px 16px 0; }
  .month-grid-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
  .month-grid-head div { text-align: center; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray-light); font-weight: 500; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .month-cell {
    background: var(--panel); border: 1px solid var(--border); border-radius: 5px;
    min-height: 92px; padding: 6px; cursor: pointer; transition: all 0.15s;
    display: flex; flex-direction: column; gap: 3px; overflow: hidden;
  }
  .month-cell:hover { border-color: rgba(201,168,76,0.4); background: var(--panel2); }
  .month-cell.other-month { opacity: 0.32; }
  .month-cell.is-today { border-color: var(--gold); background: var(--gold-dim); }
  .month-cell .mc-date { font-size: 12px; font-weight: 600; color: var(--white); font-variant-numeric: tabular-nums; }
  .month-cell.is-today .mc-date { color: var(--gold); }
  .mc-pill {
    font-size: 9.5px; line-height: 1.3; padding: 2px 5px; border-radius: 3px;
    border-left: 2px solid var(--gold); background: var(--gold-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--white);
  }
  .mc-pill.done { opacity: 0.5; text-decoration: line-through; }
  .mc-more { font-size: 9px; color: var(--gray-light); padding-left: 2px; }

  /* ════════ DASHBOARD ════════ */
  .section-divider {
    display: flex; align-items: center; gap: 12px; padding: 0 16px; margin: 26px 0 14px;
  }
  .section-divider h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.06em; color: var(--gold); white-space: nowrap; }
  .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .dash { padding: 0 16px; display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card.hero { grid-column: span 12; border-color: rgba(201,168,76,0.35); background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0.02)); }
  .card.span4 { grid-column: span 4; }
  .card.span6 { grid-column: span 6; }
  .card.span8 { grid-column: span 8; }
  .card.span12 { grid-column: span 12; }
  .card-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray-light); margin-bottom: 10px; font-weight: 500; }

  /* Hero: Plano das 100 */
  .plano-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .plano-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.05em; color: var(--white); }
  .plano-title em { color: var(--gold); font-style: normal; }
  .plano-sub { font-size: 11px; color: var(--gray-light); letter-spacing: 0.05em; }
  .plano-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .metric { text-align: center; }
  .metric .big { font-family: 'Bebas Neue', sans-serif; font-size: 44px; line-height: 0.9; color: var(--gold); font-variant-numeric: tabular-nums; }
  .metric .big.warn { color: var(--c-leilao); }
  .metric .big.ok { color: var(--c-energia); }
  .metric .lbl { font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray-light); margin-top: 4px; }
  .plano-bar { margin-top: 16px; height: 10px; border-radius: 6px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .plano-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #e8c96a); border-radius: 6px; transition: width 0.6s ease; }
  .plano-counter { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; }
  .plano-counter .cbtn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(201,168,76,0.5);
    background: transparent; color: var(--gold); font-size: 20px; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .plano-counter .cbtn:hover { background: var(--gold-dim); }
  .plano-counter .cbtn:active { transform: scale(0.92); }
  .plano-counter .cnum { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: var(--white); min-width: 70px; text-align: center; }

  /* Donut + ring */
  .ring-wrap { display: flex; align-items: center; gap: 18px; }
  .ring { position: relative; width: 110px; height: 110px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .ring-pct { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: var(--white); line-height: 1; }
  .ring .ring-cap { font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gray-light); margin-top: 2px; }
  .ring-legend { display: flex; flex-direction: column; gap: 6px; font-size: 11px; }
  .ring-legend .rl { display: flex; align-items: center; gap: 7px; color: #bbb; }
  .ring-legend .rl b { color: var(--white); font-weight: 600; margin-left: auto; font-variant-numeric: tabular-nums; padding-left: 10px; }

  /* Energy bars by area */
  .ebar { margin-bottom: 11px; }
  .ebar:last-child { margin-bottom: 0; }
  .ebar-top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
  .ebar-top .en { color: #ccc; letter-spacing: 0.03em; }
  .ebar-top .ev-h { color: var(--gray-light); font-variant-numeric: tabular-nums; }
  .ebar-track { height: 8px; border-radius: 5px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .ebar-track i { display: block; height: 100%; border-radius: 5px; transition: width 0.6s ease; }

  .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .sname { font-size: 12px; color: #bbb; }
  .stat-row .sval { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stat-row .sval small { font-size: 11px; color: var(--gray-light); font-family: 'Sora'; }

  .insight { font-size: 12.5px; line-height: 1.6; color: #cfcabf; padding: 9px 0; border-bottom: 1px solid var(--border); display: flex; gap: 9px; }
  .insight:last-child { border-bottom: none; }
  .insight .ic { color: var(--gold); flex-shrink: 0; }
  .insight.alert .ic { color: var(--c-leilao); }
  .insight.good .ic { color: var(--c-energia); }

  .log-list { display: flex; flex-direction: column; gap: 7px; max-height: 240px; overflow-y: auto; }
  .log-row { display: flex; align-items: center; gap: 9px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .log-row:last-child { border-bottom: none; }
  .log-when { color: var(--gray-light); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 10.5px; }
  .log-t { color: #ccc; flex: 1; min-width: 0; }
  .log-tag { font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; white-space: nowrap; font-weight: 500; }
  .log-tag.plano { background: var(--red-dim); color: var(--c-leilao); }
  .log-tag.luan { background: var(--gold-dim); color: var(--gold); }

  /* ════════ SPLIT LAYOUT (agenda | notas lateral) ════════ */
  /* app-scroll permanece como era — apenas scroll vertical */
  .app-scroll {
    height: calc(100vh - 132px);
    overflow: hidden; /* o scroll é delegado para main-col e side-notes-panel */
    position: relative;
    display: flex;
    flex-direction: row;
  }
  .app-scroll::-webkit-scrollbar { width: 9px; }
  .app-scroll::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }

  /* Coluna principal: ocupa todo espaço disponível, tem scroll próprio */
  .main-col {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .main-col::-webkit-scrollbar { width: 9px; }
  .main-col::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }

  /* Divisória arrastável — sempre no DOM, visibilidade controlada */
  .split-divider {
    flex: 0 0 7px;
    min-width: 7px;
    cursor: ew-resize;
    background: transparent;
    position: relative;
    z-index: 20;
    display: none;
  }
  .split-divider.visible { display: flex; align-items: stretch; }
  .split-divider::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: 3px; width: 1px;
    background: var(--border);
    transition: background 0.15s, width 0.15s, left 0.15s;
  }
  .split-divider:hover::after,
  .split-divider.active::after {
    background: var(--gold); width: 2px; left: 2.5px;
  }

  /* Painel lateral de notas */
  .side-notes-panel {
    flex: 0 0 320px;   /* largura default, sobrescrita por JS */
    width: 320px;
    min-width: 180px;
    max-width: 55vw;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--black);
    border-left: 1px solid var(--border);
    display: none;
    flex-direction: column;
    padding: 12px 12px 40px;
    gap: 10px;
  }
  .side-notes-panel::-webkit-scrollbar { width: 7px; }
  .side-notes-panel::-webkit-scrollbar-thumb { background: var(--gray-mid); border-radius: 4px; }
  .side-notes-panel.visible { display: flex; }

  /* Cabeçalho do painel lateral */
  .side-notes-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
    flex-shrink: 0;
  }
  .side-notes-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 16px;
    letter-spacing: 0.08em; color: var(--gold);
  }
  .btn-close-side {
    background: transparent; border: none; color: var(--gray-light);
    font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 3px;
    transition: color 0.15s;
  }
  .btn-close-side:hover { color: var(--white); }

  /* Botão abrir painel lateral */
  .btn-side-notes {
    font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 500;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--gray-light); background: transparent;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 3px;
    padding: 5px 10px; cursor: pointer; transition: all 0.2s;
  }
  .btn-side-notes:hover { color: var(--gold); border-color: rgba(201,168,76,0.4); }
  .btn-side-notes.active { color: var(--gold); border-color: rgba(201,168,76,0.5); background: var(--gold-dim); }

  /* ════════ NOTES — base ════════ */
  .notes-wrap { padding: 0 16px 40px; }

  /* Card de nota — base, usado tanto no wrap quanto no painel lateral */
  .notes-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; position: relative; /* para o drag-handle */
  }

  /* Versão compacta no painel lateral */
  .side-notes-panel .notes-card { padding: 12px; }
  .side-notes-panel .notes-area { font-size: 13px; min-height: 120px; }

  /* ── Handle de drag das notas ── */
  .note-drag-handle {
    position: absolute; top: 10px; left: 10px;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: rgba(255,255,255,0.18);
    cursor: grab; border-radius: 3px;
    transition: color 0.15s, background 0.15s;
    user-select: none; z-index: 5;
  }
  .note-drag-handle:hover { color: var(--gold); background: rgba(201,168,76,0.1); }
  .note-drag-handle:active { cursor: grabbing; }
  .notes-card .notes-daybar { padding-left: 22px; } /* espaço para o handle */

  /* Ghost placeholder para drag de notas */
  .note-ghost {
    background: rgba(201,168,76,0.05);
    border: 2px dashed rgba(201,168,76,0.25);
    border-radius: 8px; pointer-events: none;
  }

  /* Bloco arrastável ativo */
  .notes-card.note-dragging {
    opacity: 0;
  }

  .notes-daybar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .notes-daybar .nd-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-light); }
  .notes-daybar select {
    background: var(--black); border: 1px solid var(--border); border-radius: 4px;
    color: var(--white); font-family: 'Sora'; font-size: 13px; padding: 7px 9px; outline: none; cursor: pointer;
  }
  .notes-daybar select:focus { border-color: var(--gold); }
  .notes-status { font-size: 10px; color: var(--gray-light); margin-left: auto; letter-spacing: 0.05em; }
  .notes-status.saved { color: var(--c-energia); }

  .mic-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .mic-btn {
    display: flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 24px;
    border: 1px solid rgba(201,168,76,0.5); background: transparent; color: var(--gold);
    font-family: 'Sora'; font-size: 12px; font-weight: 500; letter-spacing: 0.05em; cursor: pointer; transition: all 0.2s;
  }
  .mic-btn:hover { background: var(--gold-dim); }
  .mic-btn .mic-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); transition: background 0.2s; }
  .mic-btn.recording { border-color: var(--c-leilao); color: #fff; background: rgba(208,71,59,0.15); }
  .mic-btn.recording .mic-dot { background: var(--c-leilao); animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  .mic-lang { background: var(--black); border: 1px solid var(--border); border-radius: 4px; color: var(--white); font-family: 'Sora'; font-size: 11px; padding: 8px 9px; outline: none; cursor: pointer; }
  .mic-lang:focus { border-color: var(--gold); }
  .mic-unsupported { font-size: 11px; color: var(--c-leilao); }

  .notes-area {
    width: 100%; min-height: 180px; resize: vertical; background: var(--black);
    border: 1px solid var(--border); border-radius: 6px; color: var(--white);
    font-family: 'Sora'; font-size: 14px; line-height: 1.7; padding: 13px; outline: none;
  }
  .notes-area:focus { border-color: var(--gold); }
  .notes-area::placeholder { color: #555; }

  /* ── MODAL ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .ctx-item { display:block; width:100%; text-align:left; padding:8px 14px; background:transparent; color:var(--text); border:none; cursor:pointer; font-family:inherit; font-size:13px; }
  .ctx-item:hover { background:rgba(255,255,255,0.06); color:var(--gold); }
  .ctx-item.danger:hover { background:rgba(192,57,43,0.18); color:#ff6b5e; }
  .modal { background: var(--panel); border: 1px solid var(--gold); border-radius: 7px; width: 100%; max-width: 400px; padding: 24px; animation: pop 0.2s ease; max-height: 90vh; overflow-y: auto; }
  @keyframes pop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 0.05em; color: var(--gold); margin-bottom: 16px; }
  .modal label { display: block; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gray-light); margin: 12px 0 5px; font-weight: 500; }
  .modal input, .modal select, .modal textarea { width: 100%; background: var(--black); border: 1px solid var(--border); border-radius: 4px; color: var(--white); font-family: 'Sora'; font-size: 14px; padding: 10px 11px; outline: none; }
  .modal input:focus, .modal select:focus { border-color: var(--gold); }
  .modal-row { display: flex; gap: 10px; }
  .modal-row > div { flex: 1; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; text-align: center; padding: 12px; }
  .btn.danger { color: var(--c-leilao); border-color: rgba(208,71,59,0.4); }
  .btn.danger:hover { background: rgba(208,71,59,0.12); }

  /* ── MINI POPUP (clique simples no card) ── */
  .mini-popup {
    position: fixed; z-index: 60; max-width: 260px;
    background: var(--panel2); border: 1px solid var(--gold);
    border-radius: 6px; padding: 10px 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    font-family: 'Sora', sans-serif; animation: popFade 0.15s ease;
    pointer-events: auto;
  }
  .mini-popup .mp-time { font-size: 10px; color: var(--gold); letter-spacing: 0.05em; font-variant-numeric: tabular-nums; margin-bottom: 4px; font-weight: 600; }
  .mini-popup .mp-title { font-size: 13.5px; color: var(--white); line-height: 1.35; font-weight: 500; }
  .mini-popup .mp-proj { font-size: 10.5px; color: var(--gray-light); margin-top: 4px; letter-spacing: 0.03em; }
  .mini-popup .mp-actions { display: flex; gap: 6px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border); }
  .mini-popup .mp-actions button {
    flex: 1; font-family: 'Sora', sans-serif; font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.05em; padding: 6px 8px; border-radius: 3px;
    background: transparent; color: var(--gold); border: 1px solid rgba(201,168,76,0.4);
    cursor: pointer; transition: all 0.15s;
  }
  .mini-popup .mp-actions button:hover { background: var(--gold-dim); }
  @keyframes popFade { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

  /* ── FAB ── */
  .fab { position: fixed; bottom: 20px; right: 20px; width: 54px; height: 54px; border-radius: 50%; background: var(--gold); color: var(--black); border: none; font-size: 30px; cursor: pointer; z-index: 40; box-shadow: 0 6px 20px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; line-height: 1; padding-bottom: 4px; transition: transform 0.15s ease; }
  .fab:active { transform: scale(0.9); }

  .toast { position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel2); border: 1px solid var(--gold); color: var(--white); padding: 11px 18px; border-radius: 6px; font-size: 13px; z-index: 200; opacity: 0; pointer-events: none; transition: all 0.3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── NOW LINE ── */
  .now-line { position: absolute; left: 56px; right: 0; height: 2px; background: rgba(192,57,43,0.8); z-index: 10; pointer-events: none; }
  .now-line::before { content: ''; position: absolute; left: -6px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #c0392b; }

  /* ── OBS POPUP ── */
  .ev-obs-icon { display: inline-block; width: 13px; height: 13px; line-height: 13px; border-radius: 50%; background: rgba(255,255,255,0.12); font-size: 8px; text-align: center; color: var(--gold); cursor: help; flex-shrink: 0; margin-left: 3px; vertical-align: middle; }
  .obs-popup { position: fixed; z-index: 80; max-width: 220px; background: #191919; border: 1px solid rgba(201,168,76,0.35); border-radius: 6px; padding: 9px 12px; font-size: 11.5px; line-height: 1.55; color: #bbb; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.55); white-space: pre-wrap; word-break: break-word; }

  @media (max-width: 820px) {
    .card.span4, .card.span6, .card.span8 { grid-column: span 12; }
    .plano-metrics { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  }
  @media (max-width: 760px) {
    .brand { font-size: 22px; }
    .controlbar { gap: 8px; }
    .nav-label { min-width: 110px; font-size: 12px; }
    .event .ev-title { font-size: 12px; }
    .event.compact .ev-title { font-size: 10.5px; }
    .month-cell { min-height: 64px; padding: 4px; }
    .month-cell .mc-date { font-size: 11px; }
    .mc-pill { font-size: 8.5px; }
    .seg button { padding: 7px 10px; }
  }

  /* ════════ DASHBOARD GRID CUSTOMIZADO ════════ */
  /* Container do dashboard: usa CSS Grid de 12 colunas */
  .dash {
    padding: 0 16px;
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 12px;
    align-items: start;
  }

  /* ── CARD BASE (mantido do original + adições) ── */
  /* .card já existe acima; aqui só adicionamos o que o grid precisa */
  .dash-card-wrap {
    position: relative;
    min-height: 80px;
  }

  /* Alça de drag: ícone ⠿ no canto superior esquerdo */
  .drag-handle {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: rgba(255,255,255,0.2);
    cursor: grab;
    z-index: 10;
    border-radius: 3px;
    transition: color 0.15s, background 0.15s;
    user-select: none;
    line-height: 1;
  }
  .drag-handle:hover {
    color: var(--gold);
    background: rgba(201,168,76,0.1);
  }
  .drag-handle:active { cursor: grabbing; }

  /* Ajusta padding do card interno para não sobrepor a alça */
  .dash-card-wrap .card {
    padding-left: 32px;
  }

  /* Alça de resize horizontal: borda direita clicável */
  .resize-h-handle {
    position: absolute;
    top: 0; right: -5px; bottom: 0;
    width: 10px;
    cursor: ew-resize;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .resize-h-handle::after {
    content: '';
    display: block;
    width: 3px;
    height: 32px;
    border-radius: 2px;
    background: rgba(255,255,255,0.12);
    transition: background 0.15s;
  }
  .resize-h-handle:hover::after { background: var(--gold); }

  /* Alça de resize vertical: borda inferior */
  .resize-v-handle {
    position: absolute;
    left: 24px; right: 24px; bottom: -5px;
    height: 10px;
    cursor: ns-resize;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .resize-v-handle::after {
    content: '';
    display: block;
    height: 3px;
    width: 48px;
    border-radius: 2px;
    background: rgba(255,255,255,0.12);
    transition: background 0.15s;
  }
  .resize-v-handle:hover::after { background: var(--gold); }

  /* Alça diagonal: canto inferior direito */
  .resize-d-handle {
    position: absolute;
    right: -2px; bottom: -2px;
    width: 16px; height: 16px;
    cursor: nwse-resize;
    z-index: 11;
  }
  .resize-d-handle::after {
    content: '';
    position: absolute;
    right: 3px; bottom: 3px;
    width: 8px; height: 8px;
    border-right: 2px solid rgba(255,255,255,0.2);
    border-bottom: 2px solid rgba(255,255,255,0.2);
    border-radius: 0 0 2px 0;
    transition: border-color 0.15s;
  }
  .resize-d-handle:hover::after { border-color: var(--gold); }

  /* Card sendo arrastado */
  .dash-card-wrap.dragging {
    opacity: 0.85;
    box-shadow: 0 12px 40px rgba(0,0,0,0.7);
    z-index: 100;
    pointer-events: none;
    transition: none !important;
  }

  /* Drop zone: highlight quando um card passa por cima */
  .dash-card-wrap.drop-target {
    outline: 2px dashed rgba(201,168,76,0.5);
    outline-offset: 2px;
  }

  /* Coluna padrão de cada card */
  .dash-card-wrap[data-cols="12"] { grid-column: span 12; }
  .dash-card-wrap[data-cols="8"]  { grid-column: span 8; }
  .dash-card-wrap[data-cols="6"]  { grid-column: span 6; }
  .dash-card-wrap[data-cols="4"]  { grid-column: span 4; }
  .dash-card-wrap[data-cols="3"]  { grid-column: span 3; }

  /* Botão resetar layout */
  .dash-controls {
    display: flex; justify-content: flex-end;
    padding: 0 16px 6px; gap: 8px;
  }
  .btn-reset-layout {
    font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 500;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--gray-light);
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px; padding: 5px 10px; cursor: pointer; transition: all 0.2s;
  }
  .btn-reset-layout:hover { color: var(--gold); border-color: rgba(201,168,76,0.4); }

  /* Ghost placeholder durante drag */
  .drag-ghost {
    background: rgba(201,168,76,0.06);
    border: 2px dashed rgba(201,168,76,0.3);
    border-radius: 8px;
    pointer-events: none;
  }

  /* Mobile: tudo span 12 */
  @media (max-width: 600px) {
    .dash-card-wrap { grid-column: span 12 !important; }
    .drag-handle, .resize-h-handle { display: none; }
  }

  /* ════════ BARRAS DUPLAS PLANEJADO/EXECUTADO ════════ */
  .ebar-dual { margin-bottom: 14px; }
  .ebar-dual:last-child { margin-bottom: 0; }
  .ebar-dual-top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; align-items: baseline; }
  .ebar-dual-top .en { color: #ccc; letter-spacing: 0.03em; }
  .ebar-dual-stats { font-size: 9.5px; color: var(--gray-light); font-variant-numeric: tabular-nums; }
  .ebar-dual-stats .stat-plan { color: var(--gold); }
  .ebar-dual-stats .stat-exec { color: var(--c-energia); }
  .ebar-dual-stats .stat-sep { opacity: 0.4; margin: 0 3px; }

  .ebar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .ebar-row-label { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gray-light); width: 62px; flex-shrink: 0; text-align: right; }
  .ebar-row-label.plan { color: rgba(201,168,76,0.7); }
  .ebar-row-label.exec { color: rgba(54,168,102,0.8); }
  .ebar-track-dual { flex: 1; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.05); overflow: hidden; }
  .ebar-track-dual i { display: block; height: 100%; border-radius: 4px; transition: width 0.7s ease; }
  .ebar-track-dual i.plan-bar { background: linear-gradient(90deg, var(--gold), rgba(201,168,76,0.7)); }
  .ebar-track-dual i.exec-bar { background: linear-gradient(90deg, var(--c-energia), rgba(54,168,102,0.7)); }
  .ebar-pct-tag { font-size: 9px; font-variant-numeric: tabular-nums; color: var(--gray-light); width: 36px; text-align: right; flex-shrink: 0; }

  /* Botão travar/destravar planejamento */
  .btn-lock-plan {
    font-family: 'Sora', sans-serif; font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    border-radius: 4px; padding: 7px 13px; cursor: pointer; transition: all 0.2s;
    border: 1px solid rgba(201,168,76,0.5); color: var(--gold); background: transparent;
    margin-bottom: 12px; display: inline-block;
  }
  .btn-lock-plan:hover { background: var(--gold-dim); }
  /* Estado travado: mostra em verde, hover sugere destravamento */
  .btn-lock-plan.locked {
    border-color: rgba(54,168,102,0.5); color: var(--c-energia);
  }
  .btn-lock-plan.locked:hover {
    background: rgba(54,168,102,0.1); border-color: rgba(54,168,102,0.8);
  }
  .snap-notice {
    font-size: 10px; color: var(--gray-light); margin-bottom: 10px;
    padding: 6px 10px; background: rgba(201,168,76,0.06); border-radius: 4px;
    border-left: 2px solid rgba(201,168,76,0.4); line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="topbar">

// ───────────── PERSISTÊNCIA (localStorage com fallback p/ memória) ─────────────
// Artifacts no Claude.ai bloqueiam localStorage; o fallback evita que o app quebre lá.
// Quando você salva o .html e abre no navegador (PC/celular), o localStorage funciona
// de verdade e os dados persistem entre sessões NAQUELE aparelho.
const STORE_KEY = 'agendaLuan2042';
let memStore = {};
const storage = {
  available: (() => { try { const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; } catch(e){ return false; } })(),
  load(){ try { if(this.available){ const r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):null; } } catch(e){} return memStore[STORE_KEY]||null; },
  save(obj){ try { if(this.available){ localStorage.setItem(STORE_KEY, JSON.stringify(obj)); return; } } catch(e){} memStore[STORE_KEY]=obj; }
};

// ───────────── STATE ─────────────
let events = [];           // {id,date,s,dur,t,c,p,lock,done,origin}
let weekNotes = {};        // { 'AAAA-MM-DD' (segunda da semana) : 'texto' } — um bloco por semana
let aprendizados = {};     // { 'AAAA-MM-DD' : 'texto' } — aprendizados por semana
let principios = '';       // bloco imutável visível em toda semana
let planoDone = 0;         // contador de reuniões do Plano das 100 já realizadas
let changeLog = [];        // registro de exclusões/inclusões: {action,t,date,s,dur,c,fromPlan,at}
let originalIds = [];      // ids que vieram no plano original (SEED) — base p/ marcar "do plano"
let weekSnapshots = {};    // { 'AAAA-MM-DD' (segunda da semana) : [ array de eventos snapshot ] }
let currentView = 'week';
let cursor = new Date();   // abre sempre na semana atual

// origin: 'plano' = veio no SEED original; 'luan' = criado por mim depois
// injectedWeeks: marca quais semanas já foram injetadas via auto-merge
function persist(){ storage.save({ events, weekNotes, aprendizados, principios, planoDone, changeLog, originalIds, injectedWeeks, weekSnapshots, v:4 }); }

// Datas das semanas que devem ser auto-injetadas se o localStorage já tem dados
// (semanas adicionadas depois que o usuário começou a usar o app)
// version: se mudar, força nova injeção limpando eventos da semana anterior
const AUTO_INJECT_WEEKS = {
  's23': {
    version: 'v2',
    label: 'Semana 23 (01–07/06/2026)',
    dates: [D23.seg, D23.ter, D23.qua, D23.qui, D23.sex, D23.sab, D23.dom],
    seedFilter: (e) => Object.values(D23).includes(e.date)
  },
  's24': {
    version: 'v1',
    label: 'Semana 24 (08–14/06/2026)',
    dates: [D24.seg, D24.ter, D24.qua, D24.qui, D24.sex, D24.sab, D24.dom],
    seedFilter: (e) => Object.values(D24).includes(e.date)
  }
};
let injectedWeeks = [];  // array de strings 'key:version' (ex: 's23:v2')

function loadAll(){
  const raw = storage.load();
  if (raw && raw.events && raw.events.length) {
    events = raw.events;
    // migração: v2 usava notes[date] (por dia); concatena no bloco da semana correspondente
    if (raw.weekNotes) {
      weekNotes = raw.weekNotes;
    } else if (raw.notes) {
      weekNotes = {};
      Object.keys(raw.notes).forEach(d=>{
        if (!raw.notes[d]||!raw.notes[d].trim()) return;
        const wk = iso(startOfWeek(parseISO(d)));
        weekNotes[wk] = (weekNotes[wk]?weekNotes[wk]+'\n\n':'') + '['+d+']\n'+raw.notes[d];
      });
    } else {
      weekNotes = {};
    }
    principios = raw.principios||'';
    aprendizados = raw.aprendizados||{};
    planoDone = raw.planoDone||0;
    changeLog = raw.changeLog||[];
    originalIds = raw.originalIds||events.filter(e=>e.origin==='plano').map(e=>e.id);
    injectedWeeks = raw.injectedWeeks||[];
    weekSnapshots = raw.weekSnapshots||{};

    // ── AUTO-INJEÇÃO de semanas novas (com suporte a versionamento)
    let injected = 0;
    let injectedLabels = [];
    Object.keys(AUTO_INJECT_WEEKS).forEach(wkKey => {
      const wk = AUTO_INJECT_WEEKS[wkKey];
      const versionTag = wkKey + ':' + wk.version;
      // já injetou ESTA versão?
      if (injectedWeeks.includes(versionTag)) return;

      // Se existe versão anterior dessa semana, remove eventos antigos do plano (origin:'plano')
      // mas preserva eventos criados manualmente pelo usuário (origin:'luan')
      const previousVersionExists = injectedWeeks.some(t => t.startsWith(wkKey + ':'));
      if (previousVersionExists) {
        const before = events.length;
        events = events.filter(e => !(wk.dates.includes(e.date) && e.origin === 'plano'));
        const removed = before - events.length;
        // remove versões antigas da flag
        injectedWeeks = injectedWeeks.filter(t => !t.startsWith(wkKey + ':'));
        if (removed > 0) injectedLabels.push(wk.label + ' (atualizada)');
      }

      // injeta eventos do SEED dessa semana com IDs novos
      const newEvents = SEED.filter(wk.seedFilter).map((e, idx) => ({
        id: 'inj_' + wkKey + '_' + wk.version + '_' + idx,
        done: false,
        origin: 'plano',
        ...e
      }));
      events.push(...newEvents);
      originalIds.push(...newEvents.map(e => e.id));
      injectedWeeks.push(versionTag);
      injected += newEvents.length;
      if (!injectedLabels.some(l => l.startsWith(wk.label))) injectedLabels.push(wk.label);
    });
    if (injected > 0) {
      persist();
      setTimeout(() => toast(injected + ' compromissos: ' + injectedLabels.join(', ')), 600);
    }
  } else {
    events = SEED.map((e,i)=>({ id:'e'+i, done:false, origin:'plano', ...e }));
    originalIds = events.map(e=>e.id);
    weekNotes = {}; aprendizados = {}; principios = ''; planoDone = 0; changeLog = {};
    weekSnapshots = {};
    // marca todas as semanas auto-injetáveis com sua versão atual (vieram no SEED inicial)
    injectedWeeks = Object.keys(AUTO_INJECT_WEEKS).map(k => k + ':' + AUTO_INJECT_WEEKS[k].version);
  }
}

// registra um evento no log da semana (exclusão ou inclusão)
function logChange(action, ev){
  changeLog.push({
    action,                                   // 'excluido' | 'incluido'
    t: ev.t, date: ev.date, s: ev.s, dur: ev.dur, c: ev.c,
    fromPlan: ev.origin==='plano',            // era do plano original?
    at: new Date().toISOString()
  });
}

// ───────────── HELPERS ─────────────
function fmtTime(h){ const hh=Math.floor(h), mm=Math.round((h-hh)*60); return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function snap(v){ return Math.round(v/SNAP)*SNAP; }
function hourToY(h){ return (h-DAY_START)*HOUR_H; }
function eventsOn(isoDate){ return events.filter(e=>e.date===isoDate); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

// ───────────── LAYOUT (sobreposição lado a lado) ─────────────
function computeLayout(dayEvents){
  const evs = dayEvents.slice().sort((a,b)=>a.s-b.s||b.dur-a.dur);
  let clusters=[], current=[], clusterEnd=-1;
  evs.forEach(ev=>{
    if(current.length && ev.s>=clusterEnd){ clusters.push(current); current=[]; clusterEnd=-1; }
    current.push(ev); clusterEnd=Math.max(clusterEnd, ev.s+ev.dur);
  });
  if(current.length) clusters.push(current);
  const layout={};
  clusters.forEach(cluster=>{
    let colsEnd=[];
    cluster.forEach(ev=>{
      let placed=false;
      for(let i=0;i<colsEnd.length;i++){ if(ev.s>=colsEnd[i]){ layout[ev.id]={col:i}; colsEnd[i]=ev.s+ev.dur; placed=true; break; } }
      if(!placed){ layout[ev.id]={col:colsEnd.length}; colsEnd.push(ev.s+ev.dur); }
    });
    const ncols=colsEnd.length;
    cluster.forEach(ev=>{ layout[ev.id].ncols=ncols; });
  });
  return layout;
}

// ───────────── VISIBLE DAYS conforme view ─────────────
function visibleDays(){
  if(currentView==='day') return [cursor];
  const sow=startOfWeek(cursor);
  return Array.from({length:7},(_,i)=>addDays(sow,i)); // semana dom→sáb
}

// ───────────── BUILD GRID (dia/semana) ─────────────
function buildGrid(){
  const days=visibleDays();
  const cols=`56px repeat(${days.length}, minmax(${days.length===1?'280px':'150px'}, 1fr))`;
  dayHeaderRow.style.gridTemplateColumns=cols;
  gridBody.style.gridTemplateColumns=cols;

  dayHeaderRow.innerHTML='<div class="corner-cell"></div>';
  days.forEach(d=>{
    const di=iso(d), sp=SPECIAL_DAYS[di];
    const h=document.createElement('div');
    h.className='day-head'+(sp?' special':'')+(di===TODAY_ISO?' is-today':'');
    h.innerHTML=`<div class="dow">${DOW_PT[d.getDay()]}</div><div class="date">${fmtDateShort(d)}</div>`+(sp&&sp.flag?`<span class="flag">${sp.flag}</span>`:'');
    h.addEventListener('click',()=>{ cursor=new Date(d); currentView='day'; syncView(); });
    dayHeaderRow.appendChild(h);
  });

  gridBody.innerHTML='';
  // Now-line (horário atual)
  const nowLineEl=document.createElement('div'); nowLineEl.id='nowLine'; nowLineEl.className='now-line'; nowLineEl.style.display='none'; gridBody.appendChild(nowLineEl);
  const timeCol=document.createElement('div'); timeCol.className='time-col';
  for(let h=DAY_START;h<DAY_END;h++){
    const slot=document.createElement('div'); slot.className='time-slot';
    slot.innerHTML=Number.isInteger(h)?`<span>${fmtTime(h)}</span>`:'';
    timeCol.appendChild(slot); }
  gridBody.appendChild(timeCol);

  days.forEach(d=>{
    const di=iso(d), sp=SPECIAL_DAYS[di];
    const col=document.createElement('div');
    col.className='day-col'+(sp?' special-bg':'')+(di===TODAY_ISO?' is-today':'');
    col.dataset.date=di;
    col.style.minHeight=(TOTAL_H*HOUR_H)+'px';
    for(let h=DAY_START;h<DAY_END;h++){ const line=document.createElement('div'); line.className='hour-line'; col.appendChild(line); }
    // clique em espaço vazio → novo evento
    col.addEventListener('mousedown',e=>{
      if(e.button!==0||e.target!==col&&!e.target.classList.contains('hour-line')) return;
      e.preventDefault();
      const r=col.getBoundingClientRect();
      const clickH=snap(DAY_START+(e.clientY-r.top)/HOUR_H);
      openModal(null, di, clickH);
    });
    if(sp&&sp.banner){ const b=document.createElement('div'); b.className='day-banner'; b.innerHTML=sp.banner; col.appendChild(b); }
    gridBody.appendChild(col);
  });
}

function renderEvents(){
  document.querySelectorAll('.event').forEach(e=>e.remove());
  const days=visibleDays();
  const cols=gridBody.querySelectorAll('.day-col');
  days.forEach((d,di)=>{
    const dayEvents=eventsOn(iso(d));
    const layout=computeLayout(dayEvents);
    const col=cols[di]; if(!col) return;
    dayEvents.forEach(ev=>{
      const lay=layout[ev.id]||{col:0,ncols:1};
      const el=document.createElement('div');
      el.className=`event cat-${ev.c}`+(ev.done?' done-ev':'')+(ev.id===selectedId?' selected':'');
      if(ev.dur<=0.75) el.classList.add('compact');
      el.dataset.id=ev.id;
      el.style.top=hourToY(ev.s)+'px';
      el.style.height=(ev.dur*HOUR_H-3)+'px';
      const gapPct=1.5, widthPct=(100/lay.ncols), leftPct=widthPct*lay.col;
      el.style.left=`calc(${leftPct}% + 3px)`;
      el.style.width=`calc(${widthPct}% - ${3+gapPct}px)`;
      const endH=ev.s+ev.dur;
      const chk=isMeal(ev)?'':`<div class="ev-check${ev.done?' done':''}" data-check="1"></div>`;
      const obsIcon=ev.obs?`<span class="ev-obs-icon" data-obs="${ev.obs.replace(/"/g,'&quot;')}">⊕</span>`:'';
      el.innerHTML=
        `<div class="ev-top">`+
          chk+
          `<div class="ev-body">`+
            `<div class="ev-time">${fmtTime(ev.s)}–${fmtTime(endH)}</div>`+
            `<div class="ev-title">${ev.t}${obsIcon}</div>`+
            (ev.p?`<div class="ev-proj">${ev.p}</div>`:'')+
          `</div>`+
        `</div>`+
        `<div class="resize-handle" data-resize="1"></div>`;
      col.appendChild(el);
    });
  });
}

// ───────────── MONTH VIEW ─────────────
function renderMonth(){
  monthGrid.innerHTML='';
  const y=cursor.getFullYear(), m=cursor.getMonth();
  const first=new Date(y,m,1);
  const gridStart=startOfWeek(first);
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i), di=iso(d);
    const cell=document.createElement('div');
    cell.className='month-cell'+(d.getMonth()!==m?' other-month':'')+(di===TODAY_ISO?' is-today':'');
    cell.dataset.date=di;
    const dayEvs=eventsOn(di).sort((a,b)=>a.s-b.s);
    let html=`<div class="mc-date">${d.getDate()}</div>`;
    const shown=dayEvs.slice(0,3);
    shown.forEach(ev=>{ html+=`<div class="mc-pill${ev.done?' done':''}" style="border-left-color:var(--c-${ev.c});background:var(--c-${ev.c}-bg)">${ev.t}</div>`; });
    if(dayEvs.length>3) html+=`<div class="mc-more">+${dayEvs.length-3} mais</div>`;
    cell.innerHTML=html;
    cell.addEventListener('click',()=>{ cursor=new Date(d); currentView='day'; syncView(); });
    monthGrid.appendChild(cell);
  }
}

// ───────────── NAV LABEL ─────────────
function updateNavLabel(){
  if(currentView==='day'){
    navLabel.innerHTML=`${DOW_PT[cursor.getDay()]} ${cursor.getDate()}/${cursor.getMonth()+1}<small>${MONTHS_PT[cursor.getMonth()]} ${cursor.getFullYear()}</small>`;
  } else if(currentView==='week'){
    const sow=startOfWeek(cursor), eow=addDays(sow,6);
    navLabel.innerHTML=`${fmtDateShort(sow)} – ${fmtDateShort(eow)}<small>S${getWeekNum(sow)} · ${MONTHS_PT[sow.getMonth()]} ${sow.getFullYear()}</small>`;
  } else {
    navLabel.innerHTML=`${MONTHS_PT[cursor.getMonth()]}<small>${cursor.getFullYear()}</small>`;
  }
}

// ───────────── MASTER RENDER ─────────────
function syncView(){
  document.querySelectorAll('#viewSeg button').forEach(b=>b.classList.toggle('active', b.dataset.view===currentView));
  if(currentView==='month'){ gridWrap.style.display='none'; monthWrap.style.display=''; renderMonth(); }
  else { gridWrap.style.display=''; monthWrap.style.display='none'; buildGrid(); renderEvents(); }
  updateNavLabel(); renderDashboard(); refreshNotesUI(); persist();
}
function render(){ if(currentView==='month'){ renderMonth(); } else { renderEvents(); } renderDashboard(); persist(); }


// ───────────── UNDO + SELEÇÃO + CLIPBOARD ─────────────
// Pilha de undo: guardamos um "snapshot" (cópia) de events ANTES de cada ação
// reversível (criar, excluir, mover, colar, marcar feito). Ctrl+Z restaura o topo.
let undoStack=[];
const UNDO_LIMIT=40;
function snapshot(){
  undoStack.push(JSON.stringify({events, changeLog, planoDone}));
  if(undoStack.length>UNDO_LIMIT) undoStack.shift();
}
function doUndo(){
  if(!undoStack.length){ toast('Nada para desfazer'); return; }
  const prev=JSON.parse(undoStack.pop());
  events=prev.events; changeLog=prev.changeLog; planoDone=prev.planoDone;
  selectedId=null; syncView(); toast('Desfeito');
}

let selectedId=null;            // card selecionado (clique simples)
let clipboard=null;             // compromisso copiado (Ctrl+C)
function selectEvent(id){ selectedId=id; renderEvents(); }
function clearSelection(){ if(selectedId){ selectedId=null; renderEvents(); } }

// ───────────── DRAG & RESIZE (agora move entre DATAS) ─────────────
function getCols(){ return Array.from(gridBody.querySelectorAll('.day-col')); }

function pointerDown(e){
  // checkbox "Feito": intercepta antes do drag
  const chk=e.target.closest('[data-check]');
  if(chk){
    const evEl=e.target.closest('.event'); const ev=events.find(x=>x.id===evEl.dataset.id);
    if(ev){ snapshot(); ev.done=!ev.done; render(); }
    e.preventDefault(); e.stopPropagation(); return;
  }
  const handle=e.target.closest('[data-resize]');
  const evEl=e.target.closest('.event'); if(!evEl) return;
  const ev=events.find(x=>x.id===evEl.dataset.id); if(!ev) return;

  e.preventDefault();
  selectEvent(ev.id);            // clique seleciona o card (p/ atalhos de teclado)
  snapshot();                    // guarda estado antes de mover/redimensionar (p/ Ctrl+Z)
  const pt=(e.touches?e.touches[0]:e);
  const startX=pt.clientX, startY=pt.clientY;
  const origS=ev.s, origDur=ev.dur, origDate=ev.date;
  let moved=false; const mode=handle?'resize':'move';
  evEl.classList.add('dragging');

  const days=visibleDays();
  const cols=getCols();
  const colWidth=cols.length?cols[0].getBoundingClientRect().width:1;

  function move(me){
    const mpt=(me.touches?me.touches[0]:me);
    const dx=mpt.clientX-startX, dy=mpt.clientY-startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4) moved=true;
    if(mode==='move'){
      let newS=snap(origS+dy/HOUR_H);
      newS=Math.max(DAY_START, Math.min(newS, DAY_END-ev.dur));
      ev.s=newS;
      // deslocamento horizontal só faz sentido na semana (7 colunas)
      if(currentView==='week'){
        const origIdx=days.findIndex(d=>iso(d)===origDate);
        let shift=Math.round(dx/colWidth);
        let newIdx=Math.max(0, Math.min(days.length-1, origIdx+shift));
        ev.date=iso(days[newIdx]);
      }
    } else {
      let newDur=snap(origDur+dy/HOUR_H);
      newDur=Math.max(SNAP, Math.min(newDur, DAY_END-ev.s));
      ev.dur=newDur;
    }
    renderEvents();
    const live=document.querySelector(`.event[data-id="${ev.id}"]`); if(live) live.classList.add('dragging');
  }
  function up(){
    document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move); document.removeEventListener('touchend',up);
    if(!moved){
      // clique simples: seleciona + mostra mini-popup com nome.
      // Para EDITAR, duplo clique (ver listener dblclick abaixo) — descarta o snapshot.
      undoStack.pop();
      renderEvents();
      // mostra popup só depois do render (o elemento foi recriado)
      const freshEl = document.querySelector('.event[data-id="' + ev.id + '"]');
      if (freshEl) showMiniPopup(ev, freshEl);
    } else {
      closeMiniPopup();
      render();   // houve movimento real: mantém snapshot, persiste
    }
  }
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',move,{passive:false}); document.addEventListener('touchend',up);
}
gridBody.addEventListener('mousedown',pointerDown);
gridBody.addEventListener('touchstart',pointerDown,{passive:false});
// duplo clique abre o editor (clique simples só seleciona)
gridBody.addEventListener('dblclick',e=>{
  const evEl=e.target.closest('.event'); if(!evEl) return;
  const ev=events.find(x=>x.id===evEl.dataset.id);
  if(ev){ closeMiniPopup(); openModal(ev); }
});
// clicar numa área vazia da grade (fora de .day-col) limpa seleção
gridBody.addEventListener('mousedown',e=>{
  if(!e.target.closest('.event')&&!e.target.closest('.day-col')){ clearSelection(); closeMiniPopup(); }
});

// ───────────── ATALHOS DE TECLADO (estilo Apple Agenda) ─────────────
// Ctrl/Cmd+C: copia o card selecionado · Ctrl/Cmd+V: cola (nova cópia, +15min)
// Ctrl/Cmd+Z: desfaz última ação · Delete/Backspace: exclui (com registro no log)
// Esc: limpa seleção / fecha modal. Ignora quando o foco está num campo de texto.
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  const mod=e.ctrlKey||e.metaKey;

  // Esc funciona mesmo em modal
  if(e.key==='Escape'){ if(overlay.classList.contains('open')) closeModal(); else clearSelection(); return; }
  if(typing) return;                          // não sequestra atalhos enquanto digita

  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); doUndo(); return; }

  if(mod && e.key.toLowerCase()==='c'){
    const ev=events.find(x=>x.id===selectedId);
    if(ev){ clipboard={...ev}; toast('Copiado: '+ev.t); }
    e.preventDefault(); return;
  }
  if(mod && e.key.toLowerCase()==='v'){
    if(clipboard){
      snapshot();
      // cola 15min após o original, no mesmo dia; marca como inclusão criada por Luan
      let ns=snap(clipboard.s+0.25); ns=Math.min(ns, DAY_END-clipboard.dur);
      const novo={...clipboard, id:'e'+Date.now(), s:ns, done:false, origin:'luan'};
      events.push(novo); logChange('incluido', novo);
      selectedId=novo.id; syncView(); toast('Colado');
    }
    e.preventDefault(); return;
  }
  if(e.key==='Delete'||e.key==='Backspace'){
    const ev=events.find(x=>x.id===selectedId);
    if(ev){ snapshot(); logChange('excluido', ev); events=events.filter(x=>x.id!==ev.id); selectedId=null; syncView(); toast('Excluído'); }
    e.preventDefault(); return;
  }
});

// ───────────── MENU DE CONTEXTO (botão direito sobre card) ─────────────
// Editar / Copiar / Colar aqui / Marcar feito / Excluir. Funciona igual Apple Agenda.
const ctxMenu=document.getElementById('ctxMenu');
let ctxTargetEvent=null;
let ctxDayDate=null;     // ISO do dia onde o menu foi aberto (p/ "Colar aqui")
let ctxTimeH=null;       // hora aproximada do clique (decimal) p/ "Colar aqui"

function openCtxMenu(x, y, ev, dayDate, timeH){
  ctxTargetEvent=ev; ctxDayDate=dayDate; ctxTimeH=timeH;
  // habilita/desabilita itens conforme contexto
  ctxMenu.querySelectorAll('.ctx-item').forEach(it=>{
    const act=it.dataset.act;
    let disabled=false;
    if(act==='edit'||act==='copy'||act==='toggle'||act==='delete') disabled=!ev;
    if(act==='paste') disabled=!clipboard;
    it.disabled=disabled; it.style.opacity=disabled?0.4:1; it.style.cursor=disabled?'default':'pointer';
  });
  // posicionar dentro da viewport
  ctxMenu.style.display='block';
  const w=ctxMenu.offsetWidth||180, h=ctxMenu.offsetHeight||200;
  const vw=window.innerWidth, vh=window.innerHeight;
  ctxMenu.style.left=Math.min(x, vw-w-8)+'px';
  ctxMenu.style.top=Math.min(y, vh-h-8)+'px';
}
function closeCtxMenu(){ ctxMenu.style.display='none'; ctxTargetEvent=null; }

gridBody.addEventListener('contextmenu', e=>{
  const evEl=e.target.closest('.event');
  // se clicou sobre um card, age sobre ele; se clicou em vazio, abre menu p/ "Colar aqui"
  let ev=null, dayDate=null, timeH=null;
  if(evEl){
    ev=events.find(x=>x.id===evEl.dataset.id);
    if(ev){ selectEvent(ev.id); dayDate=ev.date; timeH=ev.s; }
  } else {
    // descobrir dia e hora pelo ponto do clique
    const cols=getCols();
    for(let i=0;i<cols.length;i++){
      const r=cols[i].getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right){
        dayDate=cols[i].dataset.date;
        timeH=snap(DAY_START + (e.clientY-r.top)/HOUR_H);
        timeH=Math.max(DAY_START, Math.min(timeH, DAY_END-0.25));
        break;
      }
    }
    if(!dayDate) return; // clicou fora da grade
  }
  e.preventDefault();
  openCtxMenu(e.clientX, e.clientY, ev, dayDate, timeH);
});

ctxMenu.addEventListener('click', e=>{
  const it=e.target.closest('.ctx-item'); if(!it||it.disabled) return;
  const act=it.dataset.act, ev=ctxTargetEvent;
  if(act==='edit' && ev){ openModal(ev); }
  else if(act==='copy' && ev){ clipboard={...ev}; toast('Copiado: '+ev.t); }
  else if(act==='paste' && clipboard){
    snapshot();
    let ns=ctxTimeH!=null?snap(ctxTimeH):snap(clipboard.s+0.25);
    ns=Math.max(DAY_START, Math.min(ns, DAY_END-clipboard.dur));
    const novo={...clipboard, id:'e'+Date.now(), s:ns, date:ctxDayDate||clipboard.date, done:false, origin:'luan'};
    events.push(novo); logChange('incluido', novo);
    selectedId=novo.id; syncView(); toast('Colado');
  }
  else if(act==='toggle' && ev){ snapshot(); ev.done=!ev.done; render(); toast(ev.done?'Feito':'Desmarcado'); }
  else if(act==='delete' && ev){ snapshot(); logChange('excluido', ev); events=events.filter(x=>x.id!==ev.id); selectedId=null; syncView(); toast('Excluído'); }
  closeCtxMenu();
});
document.addEventListener('click', e=>{ if(!e.target.closest('#ctxMenu')) closeCtxMenu(); });
document.addEventListener('scroll', closeCtxMenu, true);
window.addEventListener('resize', closeCtxMenu);

// ───────────── DASHBOARD GRID — DRAG & DROP + RESIZE (zero dependências) ─────────────
const DASH_LAYOUT_KEY = 'dashLayout_v3';

// Definição dos cards: id, largura padrão em colunas (de 12)
const CARD_DEFS = [
  { id: 'card-hero',      cols: 12 },
  { id: 'card-conclusao', cols: 4  },
  { id: 'card-energia',   cols: 8  },
  { id: 'card-insights',  cols: 12 },
  { id: 'card-excluidos', cols: 6  },
  { id: 'card-incluidos', cols: 6  },
];

// Ordem e colunas salvas em localStorage
function saveDashLayout() {
  const dash = document.getElementById('dash');
  if (!dash) return;
  const wraps = Array.from(dash.querySelectorAll('.dash-card-wrap'));
  const layout = wraps.map(w => ({
    id:   w.dataset.cardId,
    cols: parseInt(w.dataset.cols),
    h:    w.style.minHeight || null
  }));
  try { localStorage.setItem(DASH_LAYOUT_KEY, JSON.stringify(layout)); } catch(e) {}
}

function loadDashLayout() {
  try {
    const raw = localStorage.getItem(DASH_LAYOUT_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

function resetDashLayout() {
  try { localStorage.removeItem(DASH_LAYOUT_KEY); } catch(e) {}
}

// ── Inicializa drag-and-drop nos cards do dashboard ──
function initDashDragDrop() {
  const dash = document.getElementById('dash');
  if (!dash || window.innerWidth < 600) return;

  let dragSrc = null;       // .dash-card-wrap sendo arrastado
  let ghost = null;         // clone visual seguindo o cursor
  let placeholder = null;   // espaço reservado no grid
  let startX = 0, startY = 0;
  let offsetX = 0, offsetY = 0;

  function getCardAt(x, y) {
    // Retorna o .dash-card-wrap mais próximo do ponto (x,y), excluindo o src
    const wraps = Array.from(dash.querySelectorAll('.dash-card-wrap:not(.drag-ghost)'));
    for (const w of wraps) {
      if (w === dragSrc) continue;
      const r = w.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return w;
    }
    return null;
  }

  function onHandleDown(e) {
    if (window.innerWidth < 600) return;
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    e.preventDefault();
    e.stopPropagation();

    dragSrc = handle.closest('.dash-card-wrap');
    const rect = dragSrc.getBoundingClientRect();
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    offsetX = pt.clientX - rect.left;
    offsetY = pt.clientY - rect.top;

    // Cria ghost visual (clone flutuante)
    ghost = dragSrc.cloneNode(true);
    ghost.style.cssText = `
      position: fixed;
      left: ${rect.left}px; top: ${rect.top}px;
      width: ${rect.width}px; height: ${rect.height}px;
      opacity: 0.88; pointer-events: none; z-index: 999;
      box-shadow: 0 16px 48px rgba(0,0,0,0.75);
      border-radius: 8px; transition: none;
    `;
    document.body.appendChild(ghost);

    // Insere placeholder no lugar do src
    placeholder = document.createElement('div');
    placeholder.className = 'dash-card-wrap drag-ghost';
    placeholder.dataset.cols = dragSrc.dataset.cols;
    placeholder.style.gridColumn = `span ${dragSrc.dataset.cols}`;
    placeholder.style.height = rect.height + 'px';
    dash.insertBefore(placeholder, dragSrc);
    dragSrc.style.display = 'none';

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }

  function onMove(e) {
    if (!dragSrc || !ghost) return;
    if (e.cancelable) e.preventDefault();
    const pt = e.touches ? e.touches[0] : e;

    // Move ghost
    ghost.style.left = (pt.clientX - offsetX) + 'px';
    ghost.style.top  = (pt.clientY - offsetY) + 'px';

    // Encontra card alvo
    const target = getCardAt(pt.clientX, pt.clientY);
    if (target && target !== placeholder) {
      // Remove highlight anterior
      dash.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
      target.classList.add('drop-target');

      // Move placeholder: se cursor está na metade superior → insere antes, senão → depois
      const r = target.getBoundingClientRect();
      const midY = r.top + r.height / 2;
      if (pt.clientY < midY) {
        dash.insertBefore(placeholder, target);
      } else {
        dash.insertBefore(placeholder, target.nextSibling);
      }
    }
  }

  function onUp(e) {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);

    if (!dragSrc) return;

    // Remove highlights
    dash.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));

    // Substitui placeholder pelo src real
    if (placeholder && placeholder.parentNode) {
      placeholder.parentNode.insertBefore(dragSrc, placeholder);
      placeholder.remove();
    }
    dragSrc.style.display = '';
    if (ghost) { ghost.remove(); ghost = null; }

    placeholder = null;
    dragSrc = null;

    saveDashLayout();
  }

  // Bind: delegação no dash — funciona mesmo após renderDashboard()
  dash.addEventListener('mousedown', onHandleDown);
  dash.addEventListener('touchstart', onHandleDown, { passive: false });
}

// ── Inicializa resize multi-borda nos cards (direita + inferior + diagonal) ──
function initDashResize() {
  const dash = document.getElementById('dash');
  if (!dash || window.innerWidth < 600) return;
  const COLS = 12;

  dash.addEventListener('mousedown', startResize);
  dash.addEventListener('touchstart', startResize, { passive: false });

  function startResize(e) {
    const handle = e.target.closest('.resize-h-handle, .resize-v-handle, .resize-d-handle');
    if (!handle) return;
    e.preventDefault(); e.stopPropagation();
    const wrap = handle.closest('.dash-card-wrap');
    if (!wrap) return;

    const isH = handle.classList.contains('resize-h-handle');
    const isV = handle.classList.contains('resize-v-handle');
    const isD = handle.classList.contains('resize-d-handle');

    const dashRect = dash.getBoundingClientRect();
    const colW = dashRect.width / COLS;
    const startCols = parseInt(wrap.dataset.cols) || 6;
    const startH   = wrap.offsetHeight;
    const pt = e.touches ? e.touches[0] : e;
    const startX = pt.clientX, startY = pt.clientY;

    function onMove(me) {
      if (me.cancelable) me.preventDefault();
      const mpt = me.touches ? me.touches[0] : me;
      const dx = mpt.clientX - startX;
      const dy = mpt.clientY - startY;

      if (isH || isD) {
        let newCols = Math.round(startCols + dx / colW);
        newCols = Math.max(3, Math.min(COLS, newCols));
        wrap.dataset.cols = newCols;
        wrap.style.gridColumn = `span ${newCols}`;
      }
      if (isV || isD) {
        let newH = Math.max(80, startH + dy);
        wrap.style.minHeight = newH + 'px';
        wrap.querySelector('.card').style.minHeight = (newH - 24) + 'px';
      }
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      saveDashLayout();
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }
}

// Move os cards de nota entre main-wrap e side-panel conforme `toSide`
function syncNotesToSide(toSide) {

  const panel  = document.getElementById('sideNotesPanel');
  const header = panel.querySelector('.side-notes-header');

  if (toSide) {

    order.forEach(id => {
      const card = document.getElementById(id + 'Card') || document.querySelector(`[data-note-id="${id}"]`);
      if (card) panel.appendChild(card);
    });
    // Esconde wrap + divider de seção principal
    document.getElementById('notesMainDivider').style.display = 'none';
    wrap.style.display = 'none';
  } else {
    // Devolve os cards para o wrap principal em ordem
    order.forEach(id => {
      const card = document.getElementById(id + 'Card') || document.querySelector(`[data-note-id="${id}"]`);
      if (card) wrap.appendChild(card);
    });
    document.getElementById('notesMainDivider').style.display = '';
    wrap.style.display = '';
  }
}

function initSplitter() {
  const divider = document.getElementById('splitDivider');
  const panel   = document.getElementById('sideNotesPanel');
  if (!divider || !panel) return;

  divider.addEventListener('mousedown', startSplit);
  divider.addEventListener('touchstart', startSplit, { passive: false });

  function startSplit(e) {
    e.preventDefault();
    divider.classList.add('active');
    const pt = e.touches ? e.touches[0] : e;
    const startX = pt.clientX;
    const startW = panel.offsetWidth;

    function onMove(me) {
      if (me.cancelable) me.preventDefault();
      const mpt = me.touches ? me.touches[0] : me;
      const dx = startX - mpt.clientX; // arrastar para esquerda = alargar painel
      const newW = Math.max(180, Math.min(window.innerWidth * 0.55, startW + dx));
      panel.style.width     = newW + 'px';
      panel.style.flexBasis = newW + 'px';
    }
    function onUp() {
      divider.classList.remove('active');
      saveSideWidth(panel.offsetWidth);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
  }

  // Botões abrir/fechar
  document.getElementById('sideNotesBtn').addEventListener('click', () => {
    sideOpen ? closeSidePanel() : openSidePanel();
  });
  document.getElementById('closeSideBtn').addEventListener('click', closeSidePanel);

  // Restaura estado ao carregar
  if (loadSideOpen()) openSidePanel();
}

function initNotesDragDrop() {
  // Delegação em ambos os containers (mainWrap + sidePanel)
  ['notesMainWrap', 'sideNotesPanel'].forEach(containerId => {
    const container = document.getElementById(containerId);
    if (!container) return;

    let dragSrc = null, ghost = null, placeholder = null;
    let offsetX = 0, offsetY = 0;

    container.addEventListener('mousedown', onDown);
    container.addEventListener('touchstart', onDown, { passive: false });

    function onDown(e) {
      const handle = e.target.closest('.note-drag-handle');
      if (!handle) return;
      e.preventDefault(); e.stopPropagation();
      dragSrc = handle.closest('.notes-card');
      if (!dragSrc) return;
      const rect = dragSrc.getBoundingClientRect();
      const pt   = e.touches ? e.touches[0] : e;
      offsetX = pt.clientX - rect.left;
      offsetY = pt.clientY - rect.top;

      ghost = dragSrc.cloneNode(true);
      ghost.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:0.88;pointer-events:none;z-index:999;box-shadow:0 12px 36px rgba(0,0,0,.7);border-radius:8px;transition:none;`;
      document.body.appendChild(ghost);

      placeholder = document.createElement('div');
      placeholder.className = 'notes-card note-ghost';
      placeholder.style.height = rect.height + 'px';
      container.insertBefore(placeholder, dragSrc);
      dragSrc.classList.add('note-dragging');

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onUp);
    }

    function onMove(e) {
      if (!dragSrc || !ghost) return;
      if (e.cancelable) e.preventDefault();
      const pt = e.touches ? e.touches[0] : e;
      ghost.style.left = (pt.clientX - offsetX) + 'px';
      ghost.style.top  = (pt.clientY - offsetY) + 'px';

      // Encontra card alvo dentro do container
      const cards = Array.from(container.querySelectorAll('.notes-card:not(.note-ghost):not(.note-dragging)'));
      for (const c of cards) {
        const r = c.getBoundingClientRect();
        if (pt.clientX >= r.left && pt.clientX <= r.right && pt.clientY >= r.top && pt.clientY <= r.bottom) {
          const mid = r.top + r.height / 2;
          container.insertBefore(placeholder, pt.clientY < mid ? c : c.nextSibling);
          break;
        }
      }
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      if (!dragSrc) return;
      if (placeholder && placeholder.parentNode) {
        placeholder.parentNode.insertBefore(dragSrc, placeholder);
        placeholder.remove();
      }
      dragSrc.classList.remove('note-dragging');
      if (ghost) { ghost.remove(); ghost = null; }
      placeholder = null; dragSrc = null;
      // Salva nova ordem
      const cards = Array.from(container.querySelectorAll('.notes-card[data-note-id]'));
      saveNotesOrder(cards.map(c => c.dataset.noteId));
    }
  });
}
