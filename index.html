// ───────────── SNAPSHOT DO PLANEJAMENTO ─────────────
function getWeekSnapshotKey(){
  return iso(startOfWeek(cursor));
}

function takeWeekSnapshot(){
  const key = getWeekSnapshotKey();
  if (weekSnapshots[key]) {
    // Já tem snapshot → destravar
    delete weekSnapshots[key];
    persist();
    toast('Planejamento destravado');
  } else {
    // Não tem → travar agora
    const sow = startOfWeek(cursor);
    const weekDates = Array.from({length:7},(_,i)=>iso(addDays(sow,i)));
    weekSnapshots[key] = events
      .filter(e => weekDates.includes(e.date))
      .map(e => ({...e}));
    persist();
    toast('Planejamento travado ✓');
  }
  renderDashboard();
}

// ───────────── DASHBOARD ─────────────
const PLANO_TOTAL=100;
const PLANO_START=parseISO('2026-06-03');
const PLANO_END=parseISO('2026-10-16');
function businessDaysBetween(a,b){ let n=0,d=new Date(a); while(d<=b){ const wd=d.getDay(); if(wd!==0&&wd!==6) n++; d=addDays(d,1);} return n; }

function renderDashboard(){
  const dash = document.getElementById('dash');

  const sow = startOfWeek(cursor);
  const weekDates = Array.from({length:7},(_,i)=>iso(addDays(sow,i)));
  const wkEvents = events.filter(e=>weekDates.includes(e.date) && e.c!=='imprevisto' && !isMeal(e));
  const total = wkEvents.length;
  const done  = wkEvents.filter(e=>e.done).length;
  const pctDone = total ? Math.round(done/total*100) : 0;

  const byCat = {}; let totalH = 0;
  events.filter(e=>weekDates.includes(e.date)).forEach(e=>{ byCat[e.c]=(byCat[e.c]||0)+e.dur; totalH+=e.dur; });

  const byExec = {};
  events.filter(e=>weekDates.includes(e.date)&&e.done).forEach(e=>{ byExec[e.c]=(byExec[e.c]||0)+e.dur; });

  const snapKey = getWeekSnapshotKey();
  const snap    = weekSnapshots[snapKey] || null;
  const hasSnap = !!snap;
  const bySnap  = {};
  if(snap){ snap.forEach(e=>{ bySnap[e.c]=(bySnap[e.c]||0)+e.dur; }); }

  // Plano das 100
  const today = new Date(); today.setHours(0,0,0,0);
  let bizLeft, ritmo, statusClass='', diasMsg;
  if(today<PLANO_START){ bizLeft=businessDaysBetween(PLANO_START,PLANO_END); diasMsg='dias úteis no plano'; }
  else if(today>PLANO_END){ bizLeft=0; diasMsg='prazo encerrado'; }
  else { bizLeft=businessDaysBetween(today,PLANO_END); diasMsg='dias úteis restantes'; }
  const restantes = PLANO_TOTAL - planoDone;
  ritmo = bizLeft>0 ? (restantes/bizLeft) : restantes;
  if(ritmo<=1.05) statusClass='ok'; else if(ritmo<=1.4) statusClass=''; else statusClass='warn';
  const planoPct = Math.round(planoDone/PLANO_TOTAL*100);

  const R=46, C=2*Math.PI*R, off=C*(1-pctDone/100);

  // ── Barras de energia ──
  // Escala: total de horas da semana = 100%
  // Plano: horas do snapshot ÷ total de horas do snapshot × 100%
  // Executado: horas done ÷ total de horas do snapshot × 100%
  // O total do snapshot é fixo após travado — permite comparar a distribuição

  const cats = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  let ebars = '';
  let maxDesvio = { cat:null, plan:0, exec:0, desvio:0 };

  // Total de horas do snapshot (ou da semana atual, se não travado)
  const snapTotalH = hasSnap
    ? snap.reduce((s,e) => s + e.dur, 0)
    : totalH;
  const baseH = snapTotalH > 0 ? snapTotalH : 1;

  // Total de horas executadas (para calcular % exec em relação ao mesmo total)
  const execTotalH = events.filter(e=>weekDates.includes(e.date)&&e.done)
    .reduce((s,e)=>s+e.dur, 0);

  // Botão toggle
  const snapBtn = hasSnap
    ? `<button class="btn-lock-plan locked" id="btnLockPlan">⊙ Planejamento travado — Destravar</button>`
    : `<button class="btn-lock-plan" id="btnLockPlan">⊙ Travar Planejamento</button>`;
  const snapNotice = !hasSnap
    ? `<div class="snap-notice">Trave o planejamento no início da semana para comparar com o executado.</div>`
    : '';

  cats.forEach(c => {
    // Horas planejadas: do snapshot se travado, do estado atual se não
    const planH = hasSnap ? (bySnap[c]||0) : (byCat[c]||0);
    const execH = byExec[c]||0;

    // % em relação ao total de horas da semana (snapshot ou atual)
    const planPct = Math.round((planH / baseH) * 100);
    const execPct = Math.round((execH / baseH) * 100);

    if (hasSnap && planH > 0) {
      const dev = Math.abs(execH - planH) / planH * 100;
      if (dev > maxDesvio.desvio) maxDesvio = { cat:c, plan:planH, exec:execH, desvio:dev };
    }

    const planLabel = `<span class="stat-plan">${planH.toFixed(1)}h · ${planPct}%</span>`;
    const execLabel = `<span class="stat-exec">${execH.toFixed(1)}h · ${execPct}%</span>`;

    if (hasSnap) {
      ebars += `<div class="ebar-dual">
        <div class="ebar-dual-top">
          <span class="en">${CAT_LABELS[c]}</span>
          <div class="ebar-dual-stats">${planLabel}<span class="stat-sep"> / </span>${execLabel}</div>
        </div>
        <div class="ebar-row">
          <span class="ebar-row-label plan">Plano</span>
          <div class="ebar-track-dual"><i class="plan-bar" style="width:${planPct}%"></i></div>
        </div>
        <div class="ebar-row">
          <span class="ebar-row-label exec">Feito</span>
          <div class="ebar-track-dual"><i class="exec-bar" style="width:${execPct}%"></i></div>
        </div>
      </div>`;
    } else {
      // Sem snapshot: barra simples — % do total da semana
      ebars += `<div class="ebar"><div class="ebar-top"><span class="en">${CAT_LABELS[c]}</span><span class="ev-h">${planH.toFixed(1)}h · ${planPct}%</span></div><div class="ebar-track"><i style="width:${planPct}%;background:var(--c-${c})"></i></div></div>`;
    }
  });

  // Insights
  const hCresc=byCat['crescimento']||0, hManut=byCat['manutencao']||0;
  const pctCresc=totalH?Math.round(hCresc/totalH*100):0;
  let insights=[];
  insights.push({k:ritmo>1.4?'alert':(ritmo<=1.05?'good':''),ic:'▸',txt:`Plano das 100: faltam <b>${restantes}</b> reuniões em <b>${bizLeft}</b> ${diasMsg}. Ritmo necessário: <b>${ritmo.toFixed(2)}/dia útil</b>${ritmo>1.4?' — acima de 1/dia, prazo em risco.':(ritmo<=1.05?' — dentro do alvo.':'')}`});
  insights.push({k:pctCresc>=30?'good':'',ic:'▸',txt:`Crescimento ocupou <b>${pctCresc}%</b> da semana (${hCresc.toFixed(1)}h). É o bloco que move o Projeto 2042 — deveria liderar.`});
  if(hManut>hCresc) insights.push({k:'alert',ic:'▸',txt:`Manutenção (${hManut.toFixed(1)}h) > Crescimento (${hCresc.toFixed(1)}h). Sinal de captura pela operação da consultoria. Candidato a delegar.`});
  insights.push({k:pctDone>=80?'good':(pctDone<50?'alert':''),ic:'▸',txt:`Conclusão da semana: <b>${done}/${total}</b> tarefas (${pctDone}%). Habilidade sem entrega é só sensação.`});
  if(hasSnap && maxDesvio.cat){
    const devClass = maxDesvio.desvio>50?'alert':'';
    insights.push({k:devClass,ic:'▸',txt:`Maior desvio planejado→executado: <b>${CAT_LABELS[maxDesvio.cat]}</b> — planejou <b>${maxDesvio.plan.toFixed(1)}h</b>, executou <b>${maxDesvio.exec.toFixed(1)}h</b> — desvio de <b>${Math.round(maxDesvio.desvio)}%</b>.`});
  }

  // Log
  const wkLog = changeLog.filter(l=>weekDates.includes(l.date));
  const excluidos = wkLog.filter(l=>l.action==='excluido');
  const incluidos = wkLog.filter(l=>l.action==='incluido');
  const excPlano  = excluidos.filter(l=>l.fromPlan).length;
  function logRows(arr,kind){
    if(!arr.length) return '<div class="plano-sub">Nenhum.</div>';
    return arr.map(l=>{
      const d=parseISO(l.date);
      const tag=kind==='exc'
        ?(l.fromPlan?'<span class="log-tag plano">do plano</span>':'<span class="log-tag luan">meu</span>')
        :'<span class="log-tag luan">novo</span>';
      return `<div class="log-row"><span class="log-when">${DOW_PT[d.getDay()]} ${fmtDateShort(d)} · ${fmtTime(l.s)}</span><span class="log-t">${l.t}</span>${tag}</div>`;
    }).join('');
  }
  if(excPlano>0) insights.push({k:'alert',ic:'▸',txt:`<b>${excPlano}</b> compromisso(s) do plano original foram excluídos esta semana — não remanejados, excluídos. Veja no registro abaixo o que caiu.`});

  // ── Helper: gera wrapper de card com alça de drag e resize (delega para cardWrapFull) ──
  function cardWrap(id, defaultCols, innerHTML) {
    return cardWrapFull(id, defaultCols, innerHTML);
  }

  // ── Conteúdo de cada card ──
  const htmlHero = cardWrap('card-hero', 12, `
    <div class="card hero">
      <div class="card-label">Plano das 100 · progresso</div>
      <div class="plano-head">
        <div><div class="plano-title">PLANO DAS <em>100</em></div><div class="plano-sub">100 apresentações de agentes de IA · 1 reunião concluída/dia útil</div></div>
        <div class="plano-sub">${planoDone}/${PLANO_TOTAL} concluídas</div>
      </div>
      <div class="plano-metrics">
        <div class="metric"><div class="big">${planoDone}</div><div class="lbl">Realizadas</div></div>
        <div class="metric"><div class="big">${restantes}</div><div class="lbl">Restantes</div></div>
        <div class="metric"><div class="big ${statusClass}">${ritmo.toFixed(2)}</div><div class="lbl">Ritmo/dia útil</div></div>
        <div class="metric"><div class="big">${bizLeft}</div><div class="lbl">${diasMsg}</div></div>
      </div>
      <div class="plano-bar"><i style="width:${planoPct}%"></i></div>
      <div class="plano-counter">
        <span class="plano-sub">Registrar reunião concluída:</span>
        <button class="cbtn" id="planoMinus">−</button>
        <span class="cnum">${planoDone}</span>
        <button class="cbtn" id="planoPlus">+</button>
      </div>
    </div>`);

  const htmlConclusao = cardWrap('card-conclusao', 4, `
    <div class="card">
      <div class="card-label">Conclusão da Semana</div>
      <div class="ring-wrap">
        <div class="ring">
          <svg width="110" height="110"><circle cx="55" cy="55" r="${R}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="9"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--gold)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
          <div class="ring-center"><div class="ring-pct">${pctDone}%</div><div class="ring-cap">feito</div></div>
        </div>
        <div class="ring-legend">
          <div class="rl">Concluídas <b>${done}</b></div>
          <div class="rl">Pendentes <b>${total-done}</b></div>
          <div class="rl">Total <b>${total}</b></div>
        </div>
      </div>
    </div>`);

  const htmlEnergia = cardWrap('card-energia', 8, `
    <div class="card">
      <div class="card-label">Energia por Área · planejado vs. executado</div>
      ${snapBtn}${snapNotice}
      ${ebars||'<div class="plano-sub">Sem eventos nesta semana.</div>'}
    </div>`);

  const htmlInsights = cardWrap('card-insights', 12, `
    <div class="card">
      <div class="card-label">Insights · desempenho vs. metas</div>
      ${insights.map(i=>`<div class="insight ${i.k}"><span class="ic">${i.ic}</span><span>${i.txt}</span></div>`).join('')}
    </div>`);

  const htmlExcluidos = cardWrap('card-excluidos', 6, `
    <div class="card">
      <div class="card-label">Excluídos da semana · ${excluidos.length}</div>
      <div class="log-list">${logRows(excluidos,'exc')}</div>
    </div>`);

  const htmlIncluidos = cardWrap('card-incluidos', 6, `
    <div class="card">
      <div class="card-label">Incluídos na semana · ${incluidos.length}</div>
      <div class="log-list">${logRows(incluidos,'inc')}</div>
    </div>`);

  dash.innerHTML = htmlHero + htmlConclusao + htmlEnergia + htmlInsights + htmlExcluidos + htmlIncluidos;

  // Aplica layout salvo (ordem + colunas)
  applyDashLayout();

  // Inicializa interações (sempre após o innerHTML)
  initDashDragDrop();
  initDashResize();

  // Botões internos
  document.getElementById('planoPlus').addEventListener('click',()=>{ if(planoDone<999){ planoDone++; renderDashboard(); persist(); toast('Reunião registrada · '+planoDone+'/100'); }});
  document.getElementById('planoMinus').addEventListener('click',()=>{ if(planoDone>0){ planoDone--; renderDashboard(); persist(); }});
  const btnLock = document.getElementById('btnLockPlan');
  if(btnLock) btnLock.addEventListener('click', takeWeekSnapshot);
}

// — Web Speech API —
// Ativação do microfone: instanciamos SpeechRecognition (ou webkit), com
// continuous=true (não corta em pausas curtas) e interimResults=true (mostra
// texto provisório em tempo real). O resultado FINAL é concatenado ao texto já
// existente, então pausar e retomar nunca apaga o que já foi escrito.
const micBtn=document.getElementById('micBtn');
const micLabel=document.getElementById('micLabel');
const micLang=document.getElementById('micLang');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recog=null, recording=false, baseText='';

if(!SR){
  micBtn.style.display='none';
  document.getElementById('micUnsupported').style.display='';
} else {
  recog=new SR();
  recog.continuous=true;       // mantém ouvindo durante pausas naturais da fala
  recog.interimResults=true;   // entrega transcrição parcial p/ feedback em tempo real
  recog.lang=micLang.value;

  recog.onresult=(e)=>{
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const txt=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=txt+' '; else interim+=txt;
    }
    if(final) baseText=(baseText+final);                 // consolida o trecho final
    notesArea.value=(baseText+interim).replace(/\s+\n/g,'\n'); // mostra base + provisório
    weekNotes[currentWeekKey()]=notesArea.value;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{ persist(); noteStatus.textContent='salvo ✓'; noteStatus.classList.add('saved'); },500);
  };
  recog.onend=()=>{ // se o navegador encerrar sozinho e ainda estamos "gravando", reinicia
    if(recording){ try{ recog.start(); }catch(e){} }
  };
  recog.onerror=(e)=>{ if(e.error==='not-allowed'){ toast('Permita o microfone no navegador.'); stopRec(); } };

  micLang.addEventListener('change',()=>{ recog.lang=micLang.value; if(recording){ stopRec(); setTimeout(startRec,150); } });

  function startRec(){
    baseText=notesArea.value?(notesArea.value.replace(/\s*$/,'')+' '):''; // retoma a partir do texto atual
    try{ recog.start(); }catch(e){}
    recording=true; micBtn.classList.add('recording'); micLabel.textContent='Gravando… toque p/ parar';
  }
  function stopRec(){ recording=false; try{ recog.stop(); }catch(e){} micBtn.classList.remove('recording'); micLabel.textContent='Gravar voz'; persist(); }
  micBtn.addEventListener('click',()=>{ recording?stopRec():startRec(); });
}

// ───────────── NAVEGAÇÃO ─────────────
document.getElementById('prevBtn').addEventListener('click',()=>{ shiftCursor(-1); });
document.getElementById('nextBtn').addEventListener('click',()=>{ shiftCursor(1); });
document.getElementById('todayBtn').addEventListener('click',()=>{ cursor=new Date(); cursor.setHours(0,0,0,0); syncView(); });
function shiftCursor(dir){
  if(currentView==='day') cursor=addDays(cursor,dir);
  else if(currentView==='week') cursor=addDays(cursor,dir*7);
  else cursor=new Date(cursor.getFullYear(), cursor.getMonth()+dir, 1);
  syncView();
}
document.querySelectorAll('#viewSeg button').forEach(b=>{
  b.addEventListener('click',()=>{ currentView=b.dataset.view; syncView(); });
});

// ───────────── EXPORT: RESUMO .MD ─────────────
function buildMarkdown(){
  const sow=startOfWeek(cursor), eow=addDays(sow,6);
  const weekDates=Array.from({length:7},(_,i)=>iso(addDays(sow,i)));
  const wk=events.filter(e=>weekDates.includes(e.date));
  const taskish=wk.filter(e=>e.c!=='imprevisto');
  const done=taskish.filter(e=>e.done).length, total=taskish.length;
  const pct=total?Math.round(done/total*100):0;
  const byCat={}; let totalH=0; wk.forEach(e=>{ byCat[e.c]=(byCat[e.c]||0)+e.dur; totalH+=e.dur; });
  const restantes=PLANO_TOTAL-planoDone;

  let md=`# Resumo da Semana · ${fmtDateShort(sow)}–${fmtDateShort(eow)} ${sow.getFullYear()}\n\n`;
  md+=`> Projeto Luan 2042 — metas são descartáveis, prazos são sagrados.\n\n`;
  md+=`## Plano das 100\n`;
  md+=`- Reuniões concluídas: **${planoDone}/100**\n- Restantes: **${restantes}**\n\n`;
  md+=`## Desempenho\n`;
  md+=`- Tarefas concluídas: **${done}/${total} (${pct}%)**\n`;
  md+=`- Horas planejadas: **${totalH.toFixed(1)}h**\n\n`;
  md+=`### Energia por área\n`;
  Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]).forEach(c=>{
    const h=byCat[c], p=totalH?Math.round(h/totalH*100):0;
    md+=`- ${CAT_LABELS[c]}: ${h.toFixed(1)}h (${p}%)\n`;
  });
  md+=`\n## Agenda concluída vs. pendente\n`;
  weekDates.forEach(di=>{
    const evs=eventsOn(di).sort((a,b)=>a.s-b.s); if(!evs.length) return;
    const d=parseISO(di);
    md+=`\n**${DOW_PT[d.getDay()]} ${fmtDateShort(d)}**\n`;
    evs.forEach(e=>{ md+=`- [${e.done?'x':' '}] ${fmtTime(e.s)}–${fmtTime(e.s+e.dur)} ${e.t}${e.p?' _('+e.p+')_':''}\n`; });
  });
  // Notas da semana (bloco único) + Princípios (sempre)
  const wkKey=iso(sow);
  const wkNoteText=(weekNotes[wkKey]||'').trim();
  if(wkNoteText){
    md+=`\n## Notas da Semana\n\n${wkNoteText}\n`;
  }
  if((principios||'').trim()){
    md+=`\n## Princípios\n\n${principios.trim()}\n`;
  }
  // Registro de mudanças da semana
  const wkLog=changeLog.filter(l=>weekDates.includes(l.date));
  const exc=wkLog.filter(l=>l.action==='excluido'), inc=wkLog.filter(l=>l.action==='incluido');
  if(exc.length||inc.length){
    md+=`\n## Mudanças no plano da semana\n`;
    const excPlano=exc.filter(l=>l.fromPlan).length;
    md+=`\n_${exc.length} excluído(s) (${excPlano} do plano original), ${inc.length} incluído(s)._\n`;
    if(exc.length){
      md+=`\n**Excluídos** (planejado que não aconteceu):\n`;
      exc.forEach(l=>{ const d=parseISO(l.date); md+=`- ${DOW_PT[d.getDay()]} ${fmtDateShort(d)} ${fmtTime(l.s)} — ${l.t} ${l.fromPlan?'_(do plano)_':'_(meu)_'}\n`; });
    }
    if(inc.length){
      md+=`\n**Incluídos** (entrou sem estar previsto):\n`;
      inc.forEach(l=>{ const d=parseISO(l.date); md+=`- ${DOW_PT[d.getDay()]} ${fmtDateShort(d)} ${fmtTime(l.s)} — ${l.t}\n`; });
    }
  }
  return md;
}
// Botão "Resumo .md" — abre modal editável; usuário revisa, depois baixa/copia
const mdOverlay=document.getElementById('mdOverlay');
const mdText=document.getElementById('mdText');
document.getElementById('mdBtn').addEventListener('click',()=>{
  mdText.value=buildMarkdown();
  mdOverlay.classList.add('open');
  setTimeout(()=>mdText.focus(),50);
});
document.getElementById('mdCancelBtn').addEventListener('click',()=>mdOverlay.classList.remove('open'));
mdOverlay.addEventListener('click',e=>{ if(e.target===mdOverlay) mdOverlay.classList.remove('open'); });
document.getElementById('mdDownloadBtn').addEventListener('click',()=>{
  const md=mdText.value;
  const blob=new Blob([md],{type:'text/markdown'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const sow=startOfWeek(cursor);
  a.href=url; a.download=`Agenda Semanal Luan PL2042 - ${iso(sow)}.md`; a.click();
  URL.revokeObjectURL(url);
  toast('Resumo .md baixado');
});
document.getElementById('mdCopyBtn').addEventListener('click',()=>{
  const md=mdText.value;
  if(navigator.clipboard) navigator.clipboard.writeText(md).then(()=>toast('Copiado'),()=>toast('Falha ao copiar'));
  else { mdText.select(); document.execCommand('copy'); toast('Copiado'); }
});

// ───────────── BACKUP (export/import JSON entre aparelhos) ─────────────
document.getElementById('exportDataBtn').addEventListener('click',()=>{
  const data=JSON.stringify({events,weekNotes,principios,planoDone,changeLog,originalIds,injectedWeeks,v:4,exported:new Date().toISOString()},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`Agenda Semanal Luan PL2042 - backup ${iso(new Date())}.json`; a.click();
  URL.revokeObjectURL(url);
  toast('Backup baixado · leve p/ outro aparelho e use Importar');
});
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',(e)=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.events) throw new Error('formato');
      if(!confirm('Importar este backup? Os dados atuais deste aparelho serão substituídos.')) return;
      events=data.events.map(ev=>({done:false,origin:'plano',...ev}));
      // suporta backup v2 (notes por dia) ou v3 (weekNotes + principios)
      if(data.weekNotes){ weekNotes=data.weekNotes; }
      else if(data.notes){
        weekNotes={};
        Object.keys(data.notes).forEach(d=>{
          if(!data.notes[d]||!data.notes[d].trim()) return;
          const wk=iso(startOfWeek(parseISO(d)));
          weekNotes[wk]=(weekNotes[wk]?weekNotes[wk]+'\n\n':'')+'['+d+']\n'+data.notes[d];
        });
      } else { weekNotes={}; }
      principios=data.principios||'';
      planoDone=data.planoDone||0;
      aprendizados=data.aprendizados||{};
      changeLog=data.changeLog||[]; originalIds=data.originalIds||events.filter(e=>e.origin==='plano').map(e=>e.id);
      injectedWeeks=data.injectedWeeks||[];
      weekSnapshots=data.weekSnapshots||{};
      undoStack=[]; selectedId=null;
      persist(); syncView(); refreshNotesUI(); toast('Backup importado com sucesso');
    }catch(err){ toast('Arquivo inválido'); }
  };
  reader.readAsText(file);
  e.target.value='';
});

// ───────────── NOW LINE ─────────────
function updateNowLine(){
  const line=document.getElementById('nowLine'); if(!line) return;
  const now=new Date();
  const h=now.getHours()+now.getMinutes()/60;
  if(h<DAY_START||h>DAY_END){ line.style.display='none'; return; }
  line.style.display='block';
  // posiciona relativo ao gridBody (absoluto dentro)
  line.style.top=(h-DAY_START)*HOUR_H+'px';
  // largura = todas as colunas (pular time-col de 56px)
  const gb=document.getElementById('gridBody');
  if(gb){ line.style.left='56px'; line.style.right='0'; }
}
setInterval(updateNowLine, 60000);

let obsPopupEl=null;
function closeObsPopup(){ if(obsPopupEl){ obsPopupEl.remove(); obsPopupEl=null; } }
document.addEventListener('mouseover',e=>{
  const icon=e.target.closest('.ev-obs-icon'); if(!icon) return;
  closeObsPopup();
  const pop=document.createElement('div'); pop.className='obs-popup';

// ───────────── MINI POPUP (clique simples no card → nome + ações) ─────────────
let miniPopupEl = null;
function closeMiniPopup() {
  if (miniPopupEl) { miniPopupEl.remove(); miniPopupEl = null; }
}
function showMiniPopup(ev, anchorEl) {
  closeMiniPopup();
  const rect = anchorEl.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'mini-popup';
  const endH = ev.s + ev.dur;
  pop.innerHTML =
    '<div class="mp-time">' + fmtTime(ev.s) + '–' + fmtTime(endH) + '</div>' +
    '<div class="mp-title">' + (ev.t || 'Sem título').replace(/</g,'&lt;') + '</div>' +
    (ev.p ? '<div class="mp-proj">' + ev.p.replace(/</g,'&lt;') + '</div>' : '') +
    '<div class="mp-actions">' +
      '<button data-pop-act="toggle">' + (ev.done ? 'Reabrir' : 'Feito') + '</button>' +
      '<button data-pop-act="edit">Editar</button>' +
    '</div>';
  document.body.appendChild(pop);

  // posicionar: à direita do card se couber, senão à esquerda; topo alinhado
  const popW = 260, popH = 110;
  let left = rect.right + 8;
  if (left + popW > window.innerWidth - 10) left = rect.left - popW - 8;
  if (left < 10) left = Math.max(10, rect.left);
  let top = rect.top;
  if (top + popH > window.innerHeight - 10) top = Math.max(10, window.innerHeight - popH - 10);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  miniPopupEl = pop;

  pop.querySelector('[data-pop-act="edit"]').addEventListener('click', (e) => {
    e.stopPropagation();
    closeMiniPopup();
    openModal(ev);
  });
  pop.querySelector('[data-pop-act="toggle"]').addEventListener('click', (e) => {
    e.stopPropagation();
    snapshot();
    ev.done = !ev.done;
    render();
    closeMiniPopup();
  });
}
// fechar popup ao clicar fora
document.addEventListener('mousedown', (e) => {
  if (miniPopupEl && !e.target.closest('.mini-popup') && !e.target.closest('.event')) {
    closeMiniPopup();
  }
});
// fechar popup ao rolar
document.getElementById('mainCol').addEventListener('scroll', closeMiniPopup);
gridScroller.addEventListener('scroll', closeMiniPopup);

initSplitter();
initNotesDragDrop();
